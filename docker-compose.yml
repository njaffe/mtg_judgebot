version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: judgebot-redis
    ports:
      - "6379:6379"

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
      target: proxy
    container_name: judgebot-proxy
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - redis
    # Uncomment for local dev if you want live edits without rebuilding:
    # volumes:
    #   - ./proxy:/app/proxy:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: judgebot-app
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      - proxy
    # Mount the repo for hot-reload while developing
    volumes:
      - ./:/app
    # Example: run CLI instead of Streamlit
    # command: ["python", "src/cli/main.py", "--query_text", "How does Blood Moon interact with Urborg?"]